<text x="2025" y="1740.0" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#398260">Shape preserved at every operation: [BJ,64,Tp]</text>
<text x="2025" y="1795.0" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#398260">Both u and v contain this residual connection.</text>
<text x="55" y="1950.0" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#24344B">The outer bypass is Y; the inner bypass is z; each Conv-U has its own input bypass. Memory itself has no extra residual addition.</text>
<text x="55" y="1998.0" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#24344B">PReLU uses one learnable parameter (PyTorch default). LTRR convolutions have bias=True. No speaker-guided gate is instantiated.</text>
<text x="55" y="2046.0" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#785095">Verified parameters: LTRR = 89,031; whole model including auxiliary heads = 14,805,191.</text>
